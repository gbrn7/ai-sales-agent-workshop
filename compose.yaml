# ==============================================================================
# Universal Compose Specification for AI Sales Agent Workshop
# Works seamlessly with:
#   - Docker Compose: `docker compose up -d`
#   - Podman Compose: `podman compose up -d` or `podman-compose up -d`
# ==============================================================================

name: ai-sales-agent-workshop

services:
  # ----------------------------------------------------------------------------
  # Service 1: Glowria AI Sales Agent (FastAPI, Gemini, SQLModel)
  # Default service: Starts automatically without extra flags
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-sales-agent:latest
    container_name: glowria-sales-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/clinic.db}
      - PORT=8000
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
    volumes:
      # :z flag enables SELinux relabeling for rootless Podman compatibility
      - ./data:/app/data:z
      - ./media:/app/media:z
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sales-agent-network

  # ----------------------------------------------------------------------------
  # Service 2: Evolution API (WhatsApp Gateway)
  # Optional service: Start with `--profile full` or `--profile whatsapp`
  # ----------------------------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: glowria-evolution-api
    profiles:
      - full
      - whatsapp
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-global-api-key}
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances:z
    restart: unless-stopped
    networks:
      - sales-agent-network

  # ----------------------------------------------------------------------------
  # Service 3: PostgreSQL Database (Production DB simulation)
  # Optional service: Start with `--profile postgres`
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: glowria-postgres
    profiles:
      - postgres
    ports:
      - "5439:5432"
    environment:
      - POSTGRES_DB=clinic
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d clinic" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sales-agent-network

volumes:
  evolution_instances:
    name: glowria_evolution_instances
  postgres_data:
    name: glowria_postgres_data

networks:
  sales-agent-network:
    driver: bridge
